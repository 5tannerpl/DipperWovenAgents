[project]
name = "dipper-woven-agents"
version = "0.1.0"
description = "Compliance-first agentic workflow for debt collection"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "pydantic",
    "openai",
    "python-dotenv",
    "redis",
    "asyncpg>=0.30.0",
    "pydantic-settings",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
